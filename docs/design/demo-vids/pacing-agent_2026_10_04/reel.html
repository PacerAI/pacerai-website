<style>
  *{box-sizing:border-box}
  body{margin:0;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#1c1c1e;height:100vh;display:flex;flex-direction:column;justify-content:flex-end;
    align-items:center;padding:22px 14px 12px}
  #frame{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;
    width:100%;max-width:1120px;margin:0 auto;background:#FAF9F5;border-radius:14px;overflow:hidden;
    box-shadow:0 26px 70px rgba(4,10,24,.45);border:1px solid rgba(255,255,255,.55)}
  #bar{display:flex;align-items:center;gap:8px;padding:11px 16px;background:#EFE9DF;border-bottom:1px solid #e4ddd0}
  #bar .dot{width:11px;height:11px;border-radius:50%}
  .r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
  #bar b{margin-left:8px;font-size:13px;color:#3a3f47;font-weight:600}
  #bar .conn{margin-left:auto;font-size:11.5px;color:#6b7280;display:flex;align-items:center;gap:6px}
  #bar .conn i{width:7px;height:7px;border-radius:50%;background:#28c840;display:inline-block}
  #stream{padding:22px clamp(18px,6%,90px) 40px;flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}
  .msg{margin:12px 0;display:flex}
  .msg.user{justify-content:flex-end}
  .bub{max-width:76%;padding:9px 14px;border-radius:13px;font-size:14px;line-height:1.5}
  .user .bub{background:#1F3864;color:#fff;border-bottom-right-radius:4px;font-family:"JetBrains Mono",ui-monospace,monospace}
  .pacer{display:block}
  .pacer .who{font-size:10px;font-weight:700;color:#1F3864;letter-spacing:.3px;margin:0 0 4px 2px}
  .resp{max-width:780px;font-size:13.5px;line-height:1.55;color:#242832}
  .resp p{margin:8px 0}
  .resp h4{margin:16px 0 6px;font-size:14.5px;color:#1a202c}
  .chip{display:inline-flex;align-items:center;gap:7px;margin:8px 0 4px;padding:5px 11px;border-radius:8px;
    background:#fff;border:1px solid #e4e0d6;font-size:12px;color:#4b5563;font-family:"JetBrains Mono",ui-monospace,monospace}
  .chip .s{width:10px;height:10px;border-radius:50%;border:2px solid #c9ced6;border-top-color:#1F3864;animation:sp .7s linear infinite}
  .chip .ok{color:#1a7f52;font-weight:700}
  .chip em{font-style:normal;color:#9aa1ad}
  @keyframes sp{to{transform:rotate(360deg)}}
  .viz{margin:6px 0 10px;background:#fff;border:1px solid #eceef1;border-radius:10px;overflow:hidden;
    box-shadow:0 2px 14px rgba(20,30,50,.08)}
  .viz svg{display:block;width:100%;height:auto}
  .t{border-collapse:collapse;margin:8px 0 10px;font-size:12px;background:#fff;border:1px solid #eceae4;width:auto;max-width:100%}
  .t th{text-align:left;font-weight:700;color:#1a202c;background:#f3f1ec;padding:6px 10px;border-bottom:1px solid #e4e0d6;white-space:nowrap}
  .t td{padding:5px 10px;border-bottom:1px solid #f0eee9;white-space:nowrap}
  .t .n{text-align:right;font-variant-numeric:tabular-nums}
  .t .neg{color:#C05621;font-weight:700}
  .t tr.tot td{font-weight:700;border-top:1px solid #d9d5cc}
  .actions{margin:10px 0 4px}
  .act{border:1px solid #d7dce3;background:#fff;color:#1F3864;font-weight:600;font-size:12.5px;
    padding:7px 14px;border-radius:8px;font-family:inherit}
  .fade{animation:fi .45s ease both}
  @keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .typing{display:inline-flex;gap:4px;padding:12px 14px}
  .typing i{width:7px;height:7px;border-radius:50%;background:#b9c0cc;animation:bl 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
  .cur{border-right:2px solid #cfd6e0;animation:cur .7s step-end infinite}
  @keyframes cur{50%{border-color:transparent}}
  #end{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:rgba(250,249,245,.94);opacity:0;pointer-events:none;transition:opacity .5s}
  #end.show{opacity:1;pointer-events:auto}
  #end .card{text-align:center;padding:28px 32px}
  #end h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:34px;margin:0 0 8px;color:#1a202c}
  #end p{margin:0 0 20px;color:#4b5563;font-size:15px}
  #end a{display:inline-block;background:#1F3864;color:#fff;text-decoration:none;font-weight:700;
    padding:13px 24px;border-radius:10px;font-size:15px}
  #end .opts{display:flex;justify-content:center;gap:18px;margin-top:16px}
  #end button{border:0;background:none;color:#1F3864;font-weight:600;font-size:13px;cursor:pointer;padding:4px 2px}
  #end button:hover,#rbar button:hover{text-decoration:underline}
  #rbar{position:absolute;left:0;right:0;bottom:0;z-index:30;display:none;align-items:center;justify-content:center;
    gap:16px;padding:10px 14px;background:linear-gradient(rgba(250,249,245,0),#FAF9F5 45%);font-size:13px}
  #rbar.show{display:flex}
  #rbar a{background:#1F3864;color:#fff;text-decoration:none;font-weight:700;padding:8px 16px;border-radius:9px}
  #rbar button{border:0;background:none;color:#1F3864;font-weight:600;font-size:13px;cursor:pointer}
  #vault{display:none}

const stream = document.getElementById('stream'), vault = document.getElementById('vault');
const sleep = ms => new Promise(r => setTimeout(r, ms));
let follow = true;
function toBottom(){ if(follow) stream.scrollTop = stream.scrollHeight; }
function smoothTo(y, dur){
  const y0 = stream.scrollTop, dy = Math.max(0, Math.min(y, stream.scrollHeight - stream.clientHeight)) - y0;
  // timer-stepped, not requestAnimationFrame: rAF pauses while the iframe is offscreen, which
  // stalled the whole video until a visitor scrolled to it
  return new Promise(res => { const t0 = Date.now();
    (function f(){ const k = Math.min(1, (Date.now() - t0) / dur);
      stream.scrollTop = y0 + dy * (k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2);
      if(k < 1) setTimeout(f, 16); else res(); })(); });
}
async function show(el, hold){            // bring a block into view, top-aligned, and let it sit
  follow = false;
  await smoothTo(el.offsetTop - 14, 650);
  await sleep(hold);
  follow = true;
}
async function type(el, text){
  el.classList.add('cur');
  for(let i=0;i<text.length;i++){ el.textContent = text.slice(0,i+1); await sleep(70 + Math.random()*60); }
  el.classList.remove('cur');
}
async function streamHTML(el, h){          // Claude-style streaming, word by word (tags kept whole)
  const parts = h.match(/<[^>]+>|[^<\s]+\s*|\s+/g) || [];
  let out = '';
  for(const p of parts){ out += p; el.innerHTML = out; toBottom(); if(p[0] !== '<') await sleep(28); }
}
function userMsg(){ const m = document.createElement('div'); m.className = 'msg user';
  const b = document.createElement('div'); b.className = 'bub'; m.appendChild(b); stream.appendChild(m); return b; }
async function typingDots(){
  const m = document.createElement('div'); m.className = 'msg';
  m.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>'; stream.appendChild(m); toBottom();
  await sleep(800); m.remove();
}
async function play(){
  document.getElementById('end').classList.remove('show');
  document.getElementById('rbar').classList.remove('show');
  stream.innerHTML = ''; stream.scrollTop = 0;
  await sleep(600);
  for(const beat of BEATS){
    const ub = userMsg(); toBottom(); await type(ub, beat.u); await sleep(450);
    await typingDots();
    const wrap = document.createElement('div'); wrap.className = 'msg pacer';
    wrap.innerHTML = '<div><div class="who">CLAUDE · PACER AI</div><div class="resp"></div></div>';
    stream.appendChild(wrap); const resp = wrap.querySelector('.resp');
    for(const b of beat.blocks){
      if(b.k === 'chip'){
        const c = document.createElement('div'); c.className = 'chip fade';
        c.innerHTML = '<span class="s"></span><span>Running <b>' + b.t + '</b> <em>· Pacer AI</em></span>';
        resp.appendChild(c); toBottom(); await sleep(900);
        c.innerHTML = '<span class="ok">&#10003;</span><span>Ran <b>' + b.t + '</b> <em>· Pacer AI</em></span>';
      } else if(b.k === 'viz'){
        const v = document.createElement('div'); v.className = 'viz fade';
        v.innerHTML = vault.querySelector('[data-frag="' + b.key + '"]').innerHTML;
        resp.appendChild(v); await show(v, 2600);
      } else if(b.k === 'h'){
        const h = document.createElement('h4'); h.className = 'fade'; h.textContent = b.t; resp.appendChild(h); toBottom();
        await sleep(250);
      } else if(b.k === 'p'){
        const p = document.createElement('p'); resp.appendChild(p); await streamHTML(p, b.h); await sleep(350);
      } else if(b.k === 'table'){
        const d = document.createElement('div'); d.className = 'fade'; d.innerHTML = b.h; resp.appendChild(d);
        const rows = d.querySelectorAll('tr').length;
        if(d.offsetHeight > stream.clientHeight * .55){ await show(d, 1200 + rows * 140); } else { toBottom(); await sleep(900 + rows * 120); }
      } else if(b.k === 'actions'){
        const d = document.createElement('div'); d.className = 'actions fade'; d.innerHTML = b.h; resp.appendChild(d); toBottom();

  }
  await sleep(1200);
  document.getElementById('end').classList.add('show');
}
