<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenario Planning to Improve Durable ARR Growth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    /* claude bone (default) */
    --paper:#F5F4EF; --card-a:#FBFAF7; --card-b:#F3F1EA; --line:#E4E1D8; --divider:#9AA0A8;
    --ink:#16233A; --navy:#14233A; --brand-navy:#1C3560; --ink-soft:#5A6472; --ink-faint:#8A93A0;
    --teal:#27899A; --teal-deep:#1E6E7D;
    --newlogo:#88B0DC; --base:#1F3864; --line-black:#1A1A1A; --fc-blue:#3A6EA5;
  }
  :root[data-theme="white"]{
    /* clean light / white */
    --paper:#EAECEF; --card-a:#FFFFFF; --card-b:#FFFFFF; --line:#E7E9ED; --divider:#B4B9C0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--paper);transition:background .25s ease}
  body{font-family:'DM Sans',sans-serif;color:var(--ink);display:flex;justify-content:center;padding:30px 20px}
  .card{position:relative;width:100%;max-width:1040px;background:linear-gradient(180deg,var(--card-a),var(--card-b));
        border:1px solid var(--line);border-radius:18px;padding:40px 48px 30px;
        box-shadow:0 24px 70px rgba(40,35,25,.10);transition:background .25s ease,border-color .25s ease}
  /* sun / moon theme toggle */
  .theme-toggle{position:absolute;top:22px;right:24px;display:inline-flex;align-items:center;gap:2px;z-index:12;
        background:var(--card-a);border:1px solid var(--line);border-radius:100px;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .tt-btn{width:32px;height:27px;border:none;background:transparent;border-radius:100px;cursor:pointer;color:var(--ink-faint);
        display:inline-flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
  .tt-btn.active{background:var(--brand-navy);color:#fff}
  .tt-btn svg{width:15px;height:15px}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--teal);margin-bottom:22px}
  h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,4.4vw,46px);line-height:1.08;color:var(--navy);letter-spacing:-.01em;max-width:15ch}
  .subhead{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:22px;color:var(--teal);margin-top:12px}
  .chart-head{display:flex;align-items:flex-start;justify-content:flex-end;margin:32px 0 4px;gap:20px;flex-wrap:wrap}
  .chart-eyebrow{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--teal-deep)}
  .chart-eyebrow .grain{color:var(--ink-faint);font-weight:600}
  /* legend sits in the empty left area, vertically centered on the chart's y-axis */
  .legend{position:absolute;left:0;top:50px;height:292px;display:flex;flex-direction:column;justify-content:center;
          gap:12px;font-size:13px;color:var(--ink-soft);z-index:4}
  .legend .k{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
  .sw{width:13px;height:13px;border-radius:3px;display:inline-block}
  .sw.line{width:18px;height:3px;border-radius:2px;background:var(--line-black)}
  /* the shared grid: chart + table on one column system */
  .viz{position:relative;display:grid;margin-top:8px}
  .af{font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--ink-faint);align-self:end;padding-bottom:2px}
  .af.actuals{text-align:right;padding-right:12px}
  .af.forecast{text-align:left;padding-left:12px}
  .chart-cell{position:relative}
  .divider{grid-row:1 / -1;border-left:1.5px dashed var(--divider);pointer-events:none;z-index:6}
  .cell{font-variant-numeric:tabular-nums;text-align:center;font-size:14px;padding:9px 8px;align-self:center}
  .rowlab{text-align:left;font-weight:600;color:var(--navy);font-size:13.5px;padding-left:2px}
  .yearrow{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#fff;
        background:var(--base);padding-top:11px;padding-bottom:11px}
  .arrrow.cell{font-weight:700;color:var(--navy);font-size:14.5px}
  .netrow.cell{font-weight:500;color:var(--ink)}
  .growthrow.cell{color:var(--ink-soft)}
  .subrow{padding-left:16px !important;font-weight:400;color:var(--ink-soft);font-size:12px;text-transform:none;letter-spacing:0;white-space:nowrap}
  .subval.cell{color:var(--ink-soft);font-size:13px}
  .cell.fc{color:var(--fc-blue)}
  .yearrow.fc{color:#fff}
  .cell.target{font-weight:800}
  .cell.fc.target{color:var(--fc-blue)}
  .trow .cell,.trow .rowlab{border-bottom:1px solid var(--line)}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:14px;border-top:1px solid var(--line);
        font-size:12px;color:var(--ink-faint)}
  .foot .brand{font-family:'Cormorant Garamond',serif;font-size:15px;color:var(--ink-soft)}
  .foot .brand span{color:var(--teal)}
</style>
</head>
<body>
<div class="card">
  <div class="theme-toggle" role="group" aria-label="Theme">
    <button class="tt-btn active" data-set="bone" title="Claude bone" aria-label="Claude bone theme">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="tt-btn" data-set="white" title="Light" aria-label="Light theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
  <div class="eyebrow">Pacer AI</div>
  <h1>Scenario Planning to Improve Durable ARR Growth</h1>
  <div class="subhead">GTM Forecast Modeling</div>

  <div class="chart-head">
    <div class="chart-eyebrow">ARR Growth <span class="grain" id="grainTag"></span></div>
  </div>

  <div class="viz" id="viz">
    <div class="legend">
      <span class="k"><span class="sw line"></span> ARR Growth</span>
      <span class="k"><span class="sw" style="background:#88B0DC"></span> from New Customers</span>
      <span class="k"><span class="sw" style="background:#1F3864"></span> from Existing Customers</span>
    </div>
  </div>

  <div class="foot">
    <span>getpacerai.com&nbsp; ·&nbsp; purpose-built for CROs</span>
    <span class="brand">Pacer&nbsp;<span>AI</span></span>
  </div>
</div>

<script>
/* ============================ DATA ============================ */
const DATASETS = {
  annual: {
    grainLabel: '· Annual',
    labels:  ['2023','2024','2025','2026 (f)','2027 (f)'],
    newlogo: [20, 19, 16, 18, 13],          // % of beginning ARR
    base:    [5,  5,  4,  7,  7],
    arr:     [67, 83, 100, 125, 150],        // ending ARR, $M
    netnew:  [13, 16, 17, 25, 25],           // net new ARR, $M
    forecastFrom: 3,
    growthBasis: 'YoY'
  },
  qtrly: {
    grainLabel: '· Quarterly',
    labels:  ['Q1 25','Q2 25','Q3 25','Q4 25','Q1 26 (f)','Q2 26 (f)','Q3 26 (f)','Q4 26 (f)'],
    newlogo: [17, 16, 16, 16, 16, 17, 17, 18],   // % YoY
    base:    [4,  4,  4,  4,  6,  6,  7,  7],
    arr:     [88, 92, 96, 100, 106, 112, 118, 125],  // ending ARR, $M
    netnew:  [4,  4,  4,  4,  6,  6,  6,  7],         // QoQ net new, $M
    forecastFrom: 4,
    growthBasis: 'YoY'
  }
};

/* Data source, in priority order:
   1. INJECTED — a caller (e.g. arr_target_planning) replaces the '__DATA__' token with a JS object
      literal {labels,newlogo,base,arr,netnew,forecastFrom,grainLabel,periodLabel}. Used verbatim.
   2. GRANULARITY — the skill replaces '__VIEW__' with 'annual' | 'qtrly'; falls back to #qtrly hash.
   Either way we end with one dataset object D. newlogo = "from New Customers %", base = "from Existing
   Customers %"; the two stack to the total ARR-growth line. */
let INJECTED = '__DATA__';
let GRANULARITY = '__VIEW__';
if(!DATASETS[GRANULARITY]) GRANULARITY = (location.hash.slice(1) === 'qtrly') ? 'qtrly' : 'annual';
const D = (INJECTED && typeof INJECTED === 'object') ? INJECTED : DATASETS[GRANULARITY];
const N = D.labels.length, F = D.forecastFrom;
const PERIOD_LABEL = D.periodLabel || (GRANULARITY === 'qtrly' ? 'Quarter' : 'Year');
const TOTAL = D.newlogo.map((v,i)=>v + D.base[i]);
document.getElementById('grainTag').textContent = D.grainLabel || '';

/* sun / moon theme toggle: bone (default) <-> light-white */
document.querySelectorAll('.tt-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const t = btn.dataset.set;
    if(t === 'white') document.documentElement.setAttribute('data-theme','white');
    else document.documentElement.removeAttribute('data-theme');
    document.querySelectorAll('.tt-btn').forEach(b=> b.classList.toggle('active', b.dataset.set===t));
  });
});

/* ===================== build the shared grid ===================== */
const viz = document.getElementById('viz');
viz.style.gridTemplateColumns = `184px repeat(${N}, 1fr)`;
viz.style.gridTemplateRows = '22px 320px 46px 42px 42px 42px 38px 38px';

function add(html){ const d=document.createElement('template'); d.innerHTML=html.trim(); viz.appendChild(d.content.firstElementChild); }
const gc = (a,b)=> b?`grid-column:${a}/${b};`:`grid-column:${a};`;
const gr = r=>`grid-row:${r};`;
const isFc = i => i>=F;
const fcCls = i => isFc(i)?' fc':'';

/* row 1: ACTUALS | FORECAST bracket */
add(`<div class="af actuals" style="${gc(2, 2+F)}${gr(1)}">Actuals</div>`);
add(`<div class="af forecast" style="${gc(2+F, -1)}${gr(1)}">Forecast</div>`);

/* row 2: chart canvas spanning all period columns */
add(`<div class="chart-cell" style="${gc(2,-1)}${gr(2)}"><canvas id="arrChart"></canvas></div>`);

/* vertical dashed divider — spans chart + table at the actual/forecast boundary */
add(`<div class="divider" style="${gc(2+F, 3+F)}"></div>`);

/* row 3: Year / period header (doubles as the chart x-axis labels) */
add(`<div class="cell rowlab yearrow-lab yearrow" style="${gc(1)}${gr(3)}">${PERIOD_LABEL}</div>`);
D.labels.forEach((lb,i)=> add(`<div class="cell yearrow${fcCls(i)}" style="${gc(2+i)}${gr(3)}">${lb}</div>`));

/* row 4: ARR */
add(`<div class="cell rowlab" style="${gc(1)}${gr(4)}">ARR</div>`);
D.arr.forEach((v,i)=> add(`<div class="cell arrrow trow${fcCls(i)}${i===N-1?' target':''}" style="${gc(2+i)}${gr(4)}">$${v}M</div>`));

/* row 5: Net New ARR */
add(`<div class="cell rowlab" style="${gc(1)}${gr(5)}">Net New ARR</div>`);
D.netnew.forEach((v,i)=> add(`<div class="cell netrow trow${fcCls(i)}" style="${gc(2+i)}${gr(5)}">$${v}M</div>`));

/* row 6: Total ARR Growth % */
add(`<div class="cell rowlab" style="${gc(1)}${gr(6)}">Total ARR Growth</div>`);
TOTAL.forEach((v,i)=> add(`<div class="cell growthrow${fcCls(i)}" style="${gc(2+i)}${gr(6)}">${v}%</div>`));

/* row 7: from New Customers (= New Logo band) */
add(`<div class="cell rowlab subrow" style="${gc(1)}${gr(7)}">from New Customers</div>`);
D.newlogo.forEach((v,i)=> add(`<div class="cell subval${fcCls(i)}" style="${gc(2+i)}${gr(7)}">${v}%</div>`));

/* row 8: from Existing Customers (= Customer Base band) */
add(`<div class="cell rowlab subrow" style="${gc(1)}${gr(8)}">from Existing Customers</div>`);
D.base.forEach((v,i)=> add(`<div class="cell subval${fcCls(i)}" style="${gc(2+i)}${gr(8)}">${v}%</div>`));

/* ===================== chart ===================== */
const NEWLOGO_C='#88B0DC', BASE_C='#1F3864', LINE='#1A1A1A', LINE_FC='#7A828C', NAVY='#14233A', FC_BLUE='#3A6EA5';
function grad(c, hex, a0, a1){
  const {ctx, chartArea}=c.chart; if(!chartArea) return hex;
  const g=ctx.createLinearGradient(0,chartArea.top,0,chartArea.bottom);
  g.addColorStop(0, hex+a0); g.addColorStop(1, hex+a1); return g;
}
/* in-band % + total % labels, drawn centered under each category */
const decor = { id:'decor', afterDatasetsDraw(chart){
  const {ctx, scales:{x,y}}=chart; ctx.save();
  const last=N-1;
  D.labels.forEach((_,i)=>{
    let xc=x.getPixelForValue(i);
    if(i===0) xc+=18; else if(i===last) xc-=18;   // keep edge labels fully on the fill
    const yBaseMid=y.getPixelForValue(D.base[i]/2);
    const yNewMid =y.getPixelForValue(D.base[i]+D.newlogo[i]/2);
    const yTop    =y.getPixelForValue(TOTAL[i]);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    // white in-band labels with a soft dark shadow so they read on any fill
    ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=3; ctx.fillStyle='#fff';
    ctx.font="600 12.5px 'DM Sans'"; ctx.fillText(D.newlogo[i]+'%', xc, yNewMid);
    ctx.font="600 11.5px 'DM Sans'"; ctx.fillText(D.base[i]+'%', xc, yBaseMid);
    ctx.shadowColor='transparent'; ctx.shadowBlur=0;
    ctx.textBaseline='alphabetic';
    const fc=i>=F; ctx.font=(fc?'italic ':'')+"700 15px 'DM Sans'"; ctx.fillStyle=fc?FC_BLUE:NAVY;
    ctx.fillText(TOTAL[i]+'%', xc, yTop-13);
  });
  ctx.restore();
}};

const yMax = Math.ceil((Math.max(...TOTAL)+4)/5)*5;
new Chart(document.getElementById('arrChart'),{
  type:'line', plugins:[decor],
  data:{labels:D.labels,datasets:[
    { label:'Customer Base ARR', data:D.base, fill:true, stack:'g', tension:.4,
      backgroundColor:c=>grad(c, BASE_C, 'FF','CC'), borderColor:BASE_C, borderWidth:1, pointRadius:0,
      segment:{borderDash:ctx=>ctx.p1DataIndex>=F?[5,4]:undefined} },
    { label:'New Logo ARR', data:D.newlogo, fill:true, stack:'g', tension:.4,
      backgroundColor:c=>grad(c, NEWLOGO_C, 'C2','70'), borderColor:LINE, borderWidth:2.5,
      pointRadius:c=>c.dataIndex>=F?4.5:4, pointBackgroundColor:c=>c.dataIndex>=F?LINE_FC:LINE,
      pointBorderColor:'#FBFAF7', pointBorderWidth:2,
      segment:{borderDash:ctx=>ctx.p1DataIndex>=F?[6,5]:undefined, borderColor:ctx=>ctx.p1DataIndex>=F?LINE_FC:LINE} }
  ]},
  options:{
    responsive:true, maintainAspectRatio:false,
    layout:{padding:{top:28,right:0,left:0,bottom:0}},
    animation:{duration:1400,easing:'easeOutQuart'}, interaction:{mode:'index',intersect:false},
    scales:{
      x:{ offset:true, stacked:true, grid:{display:false}, border:{display:false}, ticks:{display:false} },
      y:{ stacked:true, min:0, max:yMax, grid:{display:false}, border:{display:false}, ticks:{display:false} }
    },
    plugins:{legend:{display:false}, tooltip:{enabled:false}}
  }
});
</script>
</body>
</html>
