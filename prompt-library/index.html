<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PacerAI Prompt Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;600&family=DM+Sans:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* PacerAI brand palette */
      --navy: #080E1C;
      --navy-mid: #0F1929;
      --navy-light: #162038;
      --navy-border: #1E2D4A;
      --brand-blue: #2B7DC8;
      --teal: #27899A;
      --teal-light: #70C49C;
      --teal-pale: #D6F0E8;
      --green: #2DB87A;
      --white: #FFFFFF;
      --cream: #F7F3EC;
      --muted: #8A95A8;
      --text-light: #CDD5E0;
      --text-mid: #94A3B8;

      /* Semantic tokens */
      --bg: var(--navy);
      --surface: var(--navy-mid);
      --surface-hover: var(--navy-light);
      --border: var(--navy-border);
      --text: var(--text-light);
      --text-secondary: var(--text-mid);
      --accent: var(--teal);
      --accent-hover: var(--teal-light);
      --tag-bg: rgba(39, 137, 154, 0.12);
      --tag-text: var(--teal-light);
      --source-bg: rgba(43, 125, 200, 0.12);
      --source-text: var(--brand-blue);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Header */
    .header {
      padding: 2.5rem 2rem 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .header-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--teal), var(--teal-light));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-logo svg {
      width: 20px;
      height: 20px;
      color: var(--white);
    }

    .header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.25rem;
      font-weight: 500;
      color: var(--white);
      letter-spacing: -0.01em;
    }

    .header p {
      color: var(--text-secondary);
      font-size: 1rem;
      font-weight: 300;
    }

    /* Controls */
    .controls {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem 1.5rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
      position: relative;
    }

    .search-box svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-secondary);
    }

    .search-box input {
      width: 100%;
      padding: 0.7rem 1rem 0.7rem 2.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(39, 137, 154, 0.15);
    }

    .search-box input::placeholder {
      color: var(--muted);
    }

    .category-filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .cat-btn {
      padding: 0.5rem 1rem;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .cat-btn:hover {
      border-color: rgba(39, 137, 154, 0.5);
      color: var(--text);
    }

    .cat-btn.active {
      background: var(--teal);
      border-color: var(--teal);
      color: var(--white);
      box-shadow: 0 4px 12px rgba(39, 137, 154, 0.3);
    }

    .count-badge {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem 1rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      color: var(--muted);
    }

    /* Card grid */
    .grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem 3rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--white);
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 1.5rem;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--teal), var(--teal-light));
      opacity: 0;
      transition: opacity 0.25s;
    }

    .card:hover {
      border-color: rgba(39, 137, 154, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(39, 137, 154, 0.12);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card-category {
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      color: var(--teal);
      margin-bottom: 0.5rem;
    }

    .card-title-pill {
      display: inline-block;
      background: #EBF5FF;
      color: var(--brand-blue);
      padding: 0.3rem 0.75rem;
      border-radius: 5px;
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      margin-bottom: 0.6rem;
      line-height: 1.4;
    }

    .card-summary {
      font-size: 0.88rem;
      font-weight: 300;
      color: #4A5568;
      line-height: 1.55;
      margin-bottom: 1rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .tag {
      background: #E6F7F0;
      color: #1A6B4A;
      padding: 0.2rem 0.6rem;
      border-radius: 5px;
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
    }


    /* Modal overlay */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 14, 28, 0.8);
      backdrop-filter: blur(8px);
      z-index: 100;
      justify-content: center;
      align-items: flex-start;
      padding: 3rem 1rem;
      overflow-y: auto;
    }

    .overlay.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      max-width: 820px;
      width: 100%;
      padding: 2rem;
      position: relative;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: 1px solid transparent;
      color: var(--muted);
      font-size: 1.5rem;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .modal-close:hover {
      background: var(--navy-light);
      border-color: var(--border);
      color: var(--text);
    }

    .modal-category {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      color: var(--teal);
      margin-bottom: 0.4rem;
    }

    .modal h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.75rem;
      font-weight: 500;
      color: var(--white);
      margin-bottom: 0.5rem;
      padding-right: 2.5rem;
    }

    .modal-summary {
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 300;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }

    .modal-meta {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .prompt-block {
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      position: relative;
      margin-bottom: 1rem;
    }

    .prompt-block pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 0.84rem;
      line-height: 1.65;
      color: var(--text);
      max-height: 500px;
      overflow-y: auto;
    }

    .prompt-block pre::-webkit-scrollbar {
      width: 6px;
    }
    .prompt-block pre::-webkit-scrollbar-track {
      background: transparent;
    }
    .prompt-block pre::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .copy-btn {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      background: var(--teal);
      border: none;
      color: var(--white);
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: var(--teal-light);
      box-shadow: 0 4px 12px rgba(39, 137, 154, 0.3);
    }

    .copy-btn.copied {
      background: var(--green);
    }

    .variables-section {
      margin-top: 0.5rem;
    }

    .variables-section h4 {
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .variable-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .var-chip {
      background: rgba(43, 125, 200, 0.1);
      border: 1px solid rgba(43, 125, 200, 0.25);
      color: var(--brand-blue);
      padding: 0.25rem 0.65rem;
      border-radius: 5px;
      font-size: 0.76rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
    }

    .empty-state p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
    }

    .empty-state span {
      font-size: 0.9rem;
    }

    /* Footer */
    .footer {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem 2rem;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }

    .footer a {
      color: var(--teal);
      text-decoration: none;
    }

    .footer a:hover {
      color: var(--teal-light);
    }

    @media (max-width: 600px) {
      .header { padding: 1.5rem 1rem 1rem; }
      .header h1 { font-size: 1.75rem; }
      .controls { padding: 0 1rem 1rem; }
      .grid { padding: 0 1rem 2rem; grid-template-columns: 1fr; }
      .modal { padding: 1.5rem; }
    }
  </style>
</head>

      <div class="header-logo">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">

  <script>
    // Inline data — avoids file:// CORS issues with fetch()
    const DATA = {"categories":[{"id":"product-marketing","name":"Product Marketing","description":"Prompts for competitive analysis, persona research, and messaging frameworks","icon":"megaphone","source":"Genesys Growth"}],"prompts":[{"id":"competitor-research-websites","title":"Competitor research from websites","category":"product-marketing","tags":["competitive-analysis","positioning","messaging"],"source":"Genesys Growth","summary":"Scrape your website and competitors\u2019 sites to build a comprehensive competitive analysis table covering firmographics, personas, use cases, capabilities, and differentiators.","prompt":"<ROLE> \nAct as an expert and seasoned {{industry}} product marketer. \n\nYour specialty is creating highly-refined and factual competitors\u2019 analyses and creating compelling messaging and positioning frameworks for my product.\n\n<TASK>\n- Scrape {{insert your website}} to learn all our features, capabilities, benefits, and audience\n\n- Then, scrape the websites of competitors:\n* {{competitor website 1}}\n* {{competitor website 2}}\n* {{competitor website 3}}\n\n- Expand your analysis to review sites, authoritative blog, LinkedIn posts, and relevant sources\n\n- Analyze these specific capabilities for each competitor:\n* {{insert specific capability to research}}\n* {{insert specific capability to research}}\n* {{insert specific capability to research}}\n\n- Present your insights in one, rich table with {{your product}} and each competitor and as columns.\n- Extract specific messaging related to each competitor and compare them against my product.\n- Extract key messages around competitors\u2019 features and capabilities and compare them against {{your product}} in one descriptive line per cell.\n\n* Firmographics - geo presence, industry, n. of employees, business model, revenue\n* Target buyer - industry, segment, team size, revenue, region\n* Target persona - the department and role persona each player is targeting \u2014 distinguished by champion, economic buyer, technical buyer\n* Use case - what activities each persona is trying to achieve in the context of the product\n* Key results - how each persona measure success\n* Alternatives - key competitive alternatives to their product\n* Problems - arising from using alternatives to each product\n* Pain points - consequences of the problems of each alternative\n* Capabilities - how each product solves the problems\n* Benefits - how each product capabilities solve the alternatives\u2019 pain points\n* Differentiators - how each product is better/different from the respective alternatives\n\n<GOAL>\nMy goal is to create a compelling competitor analysis for {{organization name}} to craft a clear messaging and positioning framework for our product.\n\n<AUDIENCE>\nMy audience for this output is {insert persona} looking to {insert persona\u2019s use case} with {insert your product category} and achieve {insert persona\u2019s goal}.\n\n<STYLE AND TONE> \n- Use sentence case consistently in all titles and bullet points \u2014 avoid all caps in titles.\n- Write professionally, yet remain clear and easy-to-understand. \n\n<CONSTRAINTS>\n- Strictly ensure all findings are factual, from the last 6 months, and backed by actual sources\n- Return at least three rich bullets per cell, no more than five.\n- Be specific and give a concrete perspective about the topic.\n- Order the messages in the table by frequency of mentions and importance.\n- Present the output in a rich, easy-to-scan table\n- Provide exactly one descriptive line per cell","variables":["industry","insert your website","competitor website 1","competitor website 2","competitor website 3","insert specific capability to research","your product","organization name","insert persona","insert persona\u2019s use case","insert your product category","insert persona\u2019s goal"]},{"id":"persona-research-transcripts","title":"Persona research from transcripts","category":"product-marketing","tags":["persona","ICP","customer-insights","transcripts"],"source":"Genesys Growth","summary":"Analyze customer call transcripts to extract persona-specific messaging insights including firmographics, use cases, pain points, and real customer quotes.","prompt":"<ROLE> \nAct as an expert and seasoned {{industry}} product marketer. \n\nYour specialty is creating detailed, accurate, and insightful persona and ICP messaging frameworks based on customer insights from real-world conversations.\n\n<TASK>\n- Scrape {{insert your website}} thoroughly to understand all our features, capabilities, benefits, and target audience. \n- Review and analyze the provided customer call transcripts appended below. \n\n- Extract and distill key messaging insights specifically for each target persona. \n* {{insert specific persona to research}}\n* {{insert specific persona to research}}\n* {{insert specific persona to research}}\n\n- Present insights in a rich table with the name of the persona\u2019s company as a column and each persona trait below and as a row.\n\n* Firmographics - geo presence, industry, n. of employees, business model, revenue\n* Persona - the department and role persona each player is targeting\n* Use case - what activities each persona is trying to achieve in the context of the product\n* Key results - how each persona measure success\n* Alternatives - key competitive alternatives they\u2019re considering to achieve their use case\n* Problems - arising from using alternatives to each product\n* Pain points - consequences of the problems of each alternative\n* Capabilities - how each product solves the problems\n* Benefits - how each product capabilities solve the alternatives\u2019 pain points\n* Differentiators - how each product is better/different from the respective alternatives\n* Customer quotes - relevant, factual customer quotes from the transcript around the above traits\n\n<GOAL>\nMy goal is to create a compelling messaging analysis for {{organization name}} to craft a clear persona-specific messaging framework for our product.\n\n<AUDIENCE>\nMy audience for this output is {insert persona} looking to {insert persona\u2019s use case} with {insert your product category} and achieve {insert persona\u2019s goal}.\n\n<STYLE AND TONE> \n- Use sentence case consistently in all titles and bullet points \u2014 avoid all caps in titles.\n- Write professionally, yet remain clear and easy-to-understand. \n\n<CONSTRAINTS>\n- Strictly ensure all findings are factual, from the last 6 months, and backed by actual sources\n- Return at least three rich bullets per cell, no more than five.\n- Order the messages in the table by frequency of mentions and importance.\n- Present the output in a rich, easy-to-scan table\n- Provide exactly one descriptive line per cell\n\n<CUSTOMER CALL TRANSCRIPTS>\n{insert customer call transcript link}","variables":["industry","insert your website","insert specific persona to research","organization name","insert persona","insert persona\u2019s use case","insert your product category","insert persona\u2019s goal","insert customer call transcript link"]},{"id":"messaging-positioning-framework","title":"Messaging and positioning framework","category":"product-marketing","tags":["messaging","positioning","framework","strategy"],"source":"Genesys Growth","summary":"Synthesize competitor research and persona insights into a comprehensive messaging and positioning framework for landing pages and content assets.","prompt":"<ROLE> \nAct as an expert and seasoned {{industry}} product marketer. \n\nYour specialty is creating detailed, accurate, and insightful messaging and positioning frameworks aligned on customer insights from real-world conversations and current competitors analysis.\n\n<TASK>\n- Attentively analyse the example messaging and positioning framework attached to learn what good output looks like\n- Gather the outputs of the competitor research and persona\u2019s research prompts detailed below. \n- Synthesize the information from these sources to create the following elements of the messaging and positioning framework\n\n- Present insights in a rich table with {{your product}} and each competitor and as columns.\n- Extract key messages around competitors\u2019 features and capabilities and compare them against {{your product}} in one descriptive line per cell.\n\n* Firmographics - geo presence, industry, n. of employees, business model, revenue\n* Persona - the department and role persona each player is targeting\n* Use case - what activities each persona is trying to achieve in the context of the product\n* Key results - how each persona measure success\n* Alternatives - key competitive alternatives to their product. For each alternatives, devise:\nProblems - arising from using alternatives to each product\nPain points - consequences of the problems of each alternative\nDifferentiators - how our product solves the alternatives\u2019 problems and pain points\nFeature - which of our features substantiate the differentiators against each alternative\n* Features - the naming conventions of each of our product features. For each, devise:\nCapabilities - what each of our product capabilities do.\nBenefits - how each product capabilities help the persona achieve their use case\nDifferentiators - how each capability is help the persona better than alternatives\nKey alternative - which alternative is each feature competing against\n\n<GOAL>\nMy goal is to create a compelling messaging and positioning framework for {{organization name}} to create related landing pages and content assets.\n\n<AUDIENCE>\nMy audience for this output is {insert persona} looking to {insert persona\u2019s use case} with {insert your product category} and achieve {insert persona\u2019s goal}.\n\n<STYLE AND TONE> \n- Use sentence case consistently in all titles and bullet points \u2014 avoid all caps in titles.\n- Write professionally, yet remain clear and easy-to-understand. \n\n<CONSTRAINTS>\n- Strictly ensure all findings are factual and from the outputs I shared.\n- Return one short paragraph for each cell that encapsulates the insights researched.\n- Provide exactly one descriptive line per cell\n\n<EXAMPLE MESSAGING AND POSITIONING FRAMEWORK>\n{insert competitor analysis link}\n\n<COMPETITOR ANALYSIS>\n{insert competitor analysis link}\n\n<PERSONA RESEARCH FROM TRANSCRIPTS> \n{insert persona analysis link}\n\n<MESSAGING RESEARCH>\n{insert messaging research analysis link}","variables":["industry","your product","organization name","insert persona","insert persona\u2019s use case","insert your product category","insert persona\u2019s goal","insert competitor analysis link","insert persona analysis link","insert messaging research analysis link"]}]};

    let activeCategory = 'all';

    function getCategoryName(id) {
      const cat = DATA.categories.find(c => c.id === id);

    function render() {

          activeCategory = btn.dataset.cat;

    function getFiltered() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      return DATA.prompts.filter(p => {
        if (activeCategory !== 'all' && p.category !== activeCategory) return false;
        if (!q) return true;
        const haystack = [p.title, p.summary, p.tags.join(' '), getCategoryName(p.category), p.source || ''].join(' ').toLowerCase();
        return haystack.includes(q);
      });
    }

    function renderCards() {
      const prompts = getFiltered();
      const grid = document.getElementById('grid');
      document.getElementById('count').textContent = prompts.length + ' prompt' + (prompts.length !== 1 ? 's' : '');

      if (prompts.length === 0) {
        grid.innerHTML = '<div class="empty-state"><p>No prompts found</p><span>Try a different search or category</span></div>';
        return;
      }

      grid.innerHTML = prompts.map(p =>
        '<div class="card" data-id="' + p.id + '">' +
        '<div class="card-category">' + esc(getCategoryName(p.category)) + '</div>' +
        '<div><span class="card-title-pill">' + esc(p.title) + '</span></div>' +
        '<p class="card-summary">' + esc(p.summary) + '</p>' +
        '<div class="card-tags">' + p.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>' +
        '</div>'
      ).join('');

      grid.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => openModal(card.dataset.id));
      });
    }

    function openModal(id) {
      const p = DATA.prompts.find(x => x.id === id);
      if (!p) return;

      const modal = document.getElementById('modal');
      modal.innerHTML =
        '<button class="modal-close" id="modal-close">&times;</button>' +
        '<div class="modal-category">' + esc(getCategoryName(p.category)) + '</div>' +
        '<h2>' + esc(p.title) + '</h2>' +
        '<p class="modal-summary">' + esc(p.summary) + '</p>' +
        '<div class="modal-meta">' +
          p.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') +
          (p.source ? '<span class="tag" style="background:var(--source-bg);color:var(--source-text)">' + esc(p.source) + '</span>' : '') +
        '</div>' +
        '<div class="prompt-block">' +
          '<button class="copy-btn" id="copy-btn">Copy prompt</button>' +
          '<pre>' + esc(p.prompt) + '</pre>' +
        '</div>' +
        (p.variables && p.variables.length ?
          '<div class="variables-section">' +
            '<h4>Variables to fill in</h4>' +
            '<div class="variable-chips">' +
              p.variables.map(v => '<span class="var-chip">{{' + esc(v) + '}}</span>').join('') +
            '</div>' +
          '</div>' : '');

      document.getElementById('overlay').classList.add('open');
      document.body.style.overflow = 'hidden';

      document.getElementById('modal-close').addEventListener('click', closeModal);
      document.getElementById('copy-btn').addEventListener('click', () => copyPrompt(p.prompt));
    }

    function closeModal() {
      document.getElementById('overlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('overlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    function copyPrompt(text) {
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy prompt'; btn.classList.remove('copied'); }, 2000);
      });
    }

    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    document.getElementById('search').addEventListener('input', renderCards);

    // Initial render
    render();
  </script>
</body>
</html>
